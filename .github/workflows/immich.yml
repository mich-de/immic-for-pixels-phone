name: Nuova versione di Immich

# Ogni giorno controlla se Immich ha pubblicato una versione nuova; se sì la compila per Android con gli stessi
# script che si usano sul PC (pc/build-app.sh + apk/build.sh, senza Docker) e la pubblica come rilascio di questo
# repository, con lo stesso nome di versione di Immich (es. v3.2.4).
# Si lancia anche a mano: Actions → "Nuova versione di Immich" → Run workflow.

on:
  schedule:
    - cron: "23 4 * * *" # ogni giorno alle 04:23 UTC
  workflow_dispatch:
    inputs:
      immich_version:
        description: "Versione di Immich (es. v3.2.4); vuoto = l'ultima pubblicata"
        required: false
        default: ""
      force:
        description: "Ricompila e sostituisci i file anche se il rilascio esiste già"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: immich-release
  cancel-in-progress: false

jobs:
  controlla:
    name: Controlla la versione
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Ultima versione di Immich e rilasci già fatti
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          IMMICH_VERSION: ${{ inputs.immich_version }}
          FORCE: ${{ inputs.force }}
        run: |
          versions="$(pc/build-app.sh --versions)"
          echo "$versions"
          v="$(sed -n 's/^immich=//p' <<<"$versions")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1 && [[ "$FORCE" != "true" ]]; then
            echo "Il rilascio $v esiste già: niente da fare."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  compila:
    name: Compila e pubblica
    needs: controlla
    if: needs.controlla.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      V: ${{ needs.controlla.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Spazio su disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: SDK Android (le stesse versioni usate sul PC)
        run: |
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sm" --licenses >/dev/null || true
          "$sm" --install "build-tools;36.0.0" "platforms;android-34" >/dev/null

      - uses: actions/cache@v6
        with:
          path: .build/cache
          key: scaricati-${{ hashFiles('pc/build-app.sh', 'apk/build.sh') }}-${{ env.V }}
          restore-keys: |
            scaricati-

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Manca il segreto KEYSTORE_BASE64: la chiave con cui è firmato l'APK già installato (vedi README)"
            exit 1
          fi
          base64 -d <<<"$KEYSTORE_BASE64" > apk/immich-server.keystore

      - name: Pacchetto Immich (server, web, Node, ffmpeg, VectorChord)
        env:
          IMMICH_VERSION: ${{ env.V }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pc/build-app.sh

      - name: APK
        run: |
          apk/build.sh
          apk/build.sh --lite

      - name: Rilascio
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          IMMICH_VERSION: ${{ env.V }}
        run: |
          versions="$(pc/build-app.sh --versions)"
          pack="dist/immich-android-$V-arm64.tar.gz"
          cat > notes.md <<EOF
          Server [Immich](https://immich.app) **$V** compilato per Android arm64 da questo repository, senza Docker.
          Progetto non ufficiale, non affiliato a Immich.

          - **immich-server.apk**: l'APK completo. Si installa sopra la versione precedente senza perdere foto e
            database (stessa firma); al primo avvio il server si aggiorna da solo.
          - **immich-server-lite.apk** + **$(basename "$pack")**: APK leggero, il pacchetto si copia con adb (vedi README).

          Versioni usate (le stesse dell'immagine Docker ufficiale di Immich $V):

          \`\`\`
          $versions
          \`\`\`

          Sorgenti: [Immich $V](https://github.com/immich-app/immich/tree/$V) · script di compilazione in questo repository.
          EOF
          files=(dist/immich-server.apk dist/immich-server-lite.apk "$pack" "$pack.sha256")
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" "${files[@]}" --clobber
            gh release edit "$V" --notes-file notes.md
          else
            gh release create "$V" "${files[@]}" --title "Immich $V per Android" --notes-file notes.md
          fi

      # Un commit a ogni versione nuova: tiene traccia dell'ultima compilata e tiene attivo il repository
      # (GitHub sospende le esecuzioni pianificate dopo 60 giorni senza attività).
      - name: Segna la versione nel repository
        run: |
          echo "$V" > ULTIMA_VERSIONE
          git add ULTIMA_VERSIONE
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Immich $V"
            git push
          fi
