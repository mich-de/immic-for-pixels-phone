name: New Immich version

# Every day: if Immich has published a new version, build it for Android with the same scripts used on a PC
# (pc/build-app.sh + apk/build.sh, no Docker) and publish it as a release of this repository, named after the Immich
# version (e.g. v3.2.4). Can also be started by hand: Actions → "New Immich version" → Run workflow.

on:
  schedule:
    - cron: "23 4 * * *" # every day at 04:23 UTC
  workflow_dispatch:
    inputs:
      immich_version:
        description: "Immich version (e.g. v3.2.4); empty = the latest published"
        required: false
        default: ""
      force:
        description: "Rebuild and replace the files even if the release already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: immich-release
  cancel-in-progress: false

jobs:
  controlla:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Latest Immich version and existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          IMMICH_VERSION: ${{ inputs.immich_version }}
          FORCE: ${{ inputs.force }}
        run: |
          versions="$(pc/build-app.sh --versions)"
          echo "$versions"
          v="$(sed -n 's/^immich=//p' <<<"$versions")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1 && [[ "$FORCE" != "true" ]]; then
            echo "Release $v already exists: nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  compila:
    name: Build and publish
    needs: controlla
    if: needs.controlla.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      V: ${{ needs.controlla.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Android SDK (same versions as on the PC)
        run: |
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sm" --licenses >/dev/null || true
          "$sm" --install "build-tools;36.0.0" "platforms;android-34" >/dev/null

      - uses: actions/cache@v6
        with:
          path: .build/cache
          key: downloads-${{ hashFiles('pc/build-app.sh', 'apk/build.sh') }}-${{ env.V }}
          restore-keys: |
            downloads-

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Missing the KEYSTORE_BASE64 secret: the key the installed APKs are signed with (see docs/building.md)"
            exit 1
          fi
          base64 -d <<<"$KEYSTORE_BASE64" > apk/immich-server.keystore

      - name: Immich package (server, web, Node, ffmpeg, VectorChord)
        env:
          IMMICH_VERSION: ${{ env.V }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pc/build-app.sh

      - name: APK
        run: |
          apk/build.sh
          apk/build.sh --lite

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          IMMICH_VERSION: ${{ env.V }}
        run: |
          versions="$(pc/build-app.sh --versions)"
          pack="dist/immich-android-$V-arm64.tar.gz"
          cat > notes.md <<EOF
          [Immich](https://immich.app) server **$V** built for Android arm64 by this repository, without Docker.
          Made for the Pixel 1–5 (free unlimited Google Photos backup), should run on any arm64 Android phone.
          Unofficial project, not affiliated with Immich.

          - **immich-server.apk**: the full APK — this is the one to install. It installs over the previous version
            without losing photos or database (same signature); on its first start the server updates itself.
          - **immich-server-lite.apk** + **$(basename "$pack")**: small APK, the package is copied with adb (see docs/building.md).

          **To get your photos into Google Photos** (Pixel 1–5): in the app turn on *Keep the originals in DCIM/Immich*,
          then in Google Photos on the same phone turn on the backup of the `admin` folder (*Settings → Backup → Back up
          device folders*) and, on Pixel 2–5, keep *Backup quality* on *Storage saver* (the free unlimited one). Each
          photo then reaches Google Photos a few minutes after it reaches Immich.

          Tried it on a phone other than a Pixel 5? Please [open a test report](https://github.com/${{ github.repository }}/issues/new?template=test-report.yml).

          Versions used (the same as Immich's official Docker image for $V):

          \`\`\`
          $versions
          \`\`\`

          Sources: [Immich $V](https://github.com/immich-app/immich/tree/$V) · build scripts in this repository.
          EOF
          files=(dist/immich-server.apk dist/immich-server-lite.apk "$pack" "$pack.sha256")
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" "${files[@]}" --clobber
            gh release edit "$V" --title "Immich $V for Android" --notes-file notes.md
          else
            gh release create "$V" "${files[@]}" --title "Immich $V for Android" --notes-file notes.md
          fi

      # One commit per new version: records the latest build and keeps the repository active
      # (GitHub suspends scheduled runs after 60 days without activity).
      - name: Record the version in the repository
        run: |
          echo "$V" > ULTIMA_VERSIONE
          git add ULTIMA_VERSIONE
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Immich $V"
            git pull --rebase origin "${GITHUB_REF_NAME}" # another commit may have landed meanwhile
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
